name: Acquire verified 40-year-gap celebrity photo pairs
on:
  push:
    branches: [picture-rounds-14-formats-20261126]
    paths:
      - .github/workflows/acquire-forty-year-photo-round.yml
      - drafts/picture-rounds/famous-faces-then-now-0001/verified-40-year-candidate-sources.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Acquire source-first CC/CC0 portraits
        id: acquire
        continue-on-error: true
        run: |
          python scripts/source-commons-picture-assets.py \
            drafts/picture-rounds/famous-faces-then-now-0001/verified-40-year-candidate-sources.json \
            --out drafts/picture-rounds/famous-faces-then-now-0001/licensed-candidates/forty-year-rebuild
      - name: Archive real processed image files with licence records
        uses: actions/upload-artifact@v4
        with:
          name: forty-year-celebrity-photos
          path: drafts/picture-rounds/famous-faces-then-now-0001/licensed-candidates/forty-year-rebuild/
          if-no-files-found: warn
      - name: Persist original approved-file candidates with provenance
        run: |
          git config user.name "QuizPro image sourcing"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/picture-rounds/famous-faces-then-now-0001/licensed-candidates/forty-year-rebuild
          if ! git diff --cached --quiet; then
            git commit -m "Archive real 40-year-gap candidate photo assets and licence evidence"
            for attempt in 1 2 3 4 5; do
              git fetch origin picture-rounds-14-formats-20261126
              git rebase origin/picture-rounds-14-formats-20261126
              if git push; then break; fi
              if [ "$attempt" = "5" ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Reject incomplete acquisition (but keep report)
        if: steps.acquire.outcome == 'failure'
        run: exit 1
