name: Source two UK commercial-use portrait candidates
on:
  push:
    branches: [picture-rounds-14-formats-20261126]
    paths:
      - .github/workflows/source-uk-commercial-question-alternatives.yml
      - drafts/picture-rounds/famous-faces-then-now-0001/uk-commercial-question-alternatives.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Acquire verified photographer-licensed files
        run: |
          python scripts/source-commons-picture-assets.py \
            drafts/picture-rounds/famous-faces-then-now-0001/uk-commercial-question-alternatives.json \
            --out drafts/picture-rounds/famous-faces-then-now-0001/licensed-candidates/uk-portraits-v3
      - uses: actions/upload-artifact@v4
        with:
          name: vetted-branson-and-williams-originals
          path: drafts/picture-rounds/famous-faces-then-now-0001/licensed-candidates/uk-portraits-v3
      - name: Commit actual candidates and rights metadata
        run: |
          git config user.name "QuizPro picture asset bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/picture-rounds/famous-faces-then-now-0001/licensed-candidates/uk-portraits-v3
          if ! git diff --cached --quiet; then
            git commit -m "Archive Branson and Williams commercially licensed images"
            for attempt in 1 2 3 4 5; do
              git fetch origin picture-rounds-14-formats-20261126
              git rebase origin/picture-rounds-14-formats-20261126
              if git push; then break; fi
              if [ "$attempt" = "5" ]; then exit 1; fi
              sleep 3
            done
          fi
