name: Validate source-first picture round pipeline
on:
  push:
    branches:
      - picture-rounds-14-formats-20261126
    paths:
      - .github/workflows/validate-picture-asset-pipeline.yml
      - src/components/SimpleQuizBuilder.jsx
      - scripts/build-approved-picture-round.mjs
      - scripts/picture-round-age-gap.mjs
      - scripts/test-picture-round-age-gap.mjs
      - scripts/source-commons-picture-assets.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install QuizPro dependencies
        run: npm ci
      - name: Check package builder syntax
        run: node --check scripts/build-approved-picture-round.mjs
      - name: Check verified 40-year photo gap unit tests
        run: node scripts/test-picture-round-age-gap.mjs
      - name: Check image acquisition syntax
        run: python -m py_compile scripts/source-commons-picture-assets.py
      - name: Compile QuizPro and image-import UI
        run: npm run build
