name: Import TPC Nov 2026 quiz

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-tpc-nov-2026.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quizpro-tpc-nov-2026-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current QuizPro library
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Add approved quiz and reusable rounds without replacing existing entries
        run: node scripts/import-tpc-nov-2026.mjs
      - name: Commit additive import to the shared library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quiz-library.json
          if git diff --cached --quiet; then
            echo "TPC Nov 2026 is already present; nothing to change."
            exit 0
          fi
          git commit -m "QuizPro: import TPC Nov 2026 (7 saved rounds, 70 questions)"
          git push
