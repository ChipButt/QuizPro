name: Source verified solo Cliff Richard 1964 picture
on:
  push:
    branches: [picture-rounds-14-formats-20261126]
    paths:
      - .github/workflows/acquire-cliff-solo-40year.yml
      - drafts/picture-rounds/famous-faces-then-now-0001/cliff-richard-solo-1964.json
  workflow_dispatch:
permissions: {contents: write}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Acquire real solo image from original 1964 CC0 file
        run: |
          python scripts/source-commons-picture-assets.py \
          drafts/picture-rounds/famous-faces-then-now-0001/cliff-richard-solo-1964.json \
          --out drafts/picture-rounds/famous-faces-then-now-0001/licensed-candidates/cliff-solo
      - uses: actions/upload-artifact@v4
        with:
          name: cliff-richard-1964-solo-real-image
          path: drafts/picture-rounds/famous-faces-then-now-0001/licensed-candidates/cliff-solo/
      - name: Store downloaded file and source provenance on draft branch
        run: |
          git config user.name "QuizPro picture photos"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/picture-rounds/famous-faces-then-now-0001/licensed-candidates/cliff-solo
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified solo 1964 Cliff Richard candidate"
            for attempt in 1 2 3 4 5; do
              git fetch origin picture-rounds-14-formats-20261126
              git rebase origin/picture-rounds-14-formats-20261126
              if git push; then break; fi
              if [ "$attempt" = "5" ]; then exit 1; fi
              sleep 3
            done
          fi
