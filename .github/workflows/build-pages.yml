name: Build QuizPro Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.dev.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "scripts/**"
      - ".github/workflows/build-pages.yml"

permissions:
  contents: write

concurrency:
  group: quizpro-pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build deployable files
        run: npm run deploy:pages

      - name: Commit generated Pages bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          if git diff --cached --quiet; then
            echo "Pages bundle already up to date."
            exit 0
          fi
          git commit -m "Build live QuizPro Pages bundle"
          git push
