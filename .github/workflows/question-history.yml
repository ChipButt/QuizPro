name: Update QuizPro question history
on:
  push:
    branches: [main]
    paths:
      - 'data/quiz-library.json'
      - 'scripts/build-question-history.mjs'
      - 'scripts/check-questions.mjs'
      - 'scripts/check-questions.test.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quizpro-question-history
  cancel-in-progress: false
jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the read-only duplicate checker
        run: node --test scripts/check-questions.test.mjs
      - name: Generate searchable history without changing the quiz library
        run: node scripts/build-question-history.mjs
      - name: Commit history only if updated
        run: |
          if ! git diff --quiet -- data/question-history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/question-history.json
            git commit -m "Refresh derived question history"
            git push
          fi
