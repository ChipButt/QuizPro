name: Import approved Guess the Performer 0001
on:
  push:
    branches: [main]
    paths:
      - 'assets/picture-rounds/guess-the-performer-0001/**'
      - 'data/imports/import-guess-the-performer-0001.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quizpro-import-guess-the-performer-0001
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and import approved images
        run: node data/imports/import-guess-the-performer-0001.mjs
      - name: Validate question checker
        run: node --test scripts/check-questions.test.mjs
      - name: Refresh question history
        run: node scripts/build-question-history.mjs
      - name: Commit only additive changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/quiz-library.json data/question-history.json
          if test -d public/assets/picture-rounds/guess-the-performer-0001; then git add public/assets/picture-rounds/guess-the-performer-0001; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import approved Guess the Performer 0001'
          git pull --rebase origin main
          git push origin HEAD:main
